name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:

env:
  SDL3_VER: release-3.4.10
  SDL3_TTF_VER: release-3.2.2
  SDL3_IMAGE_VER: release-3.4.6
  SDL3_MIXER_VER: release-3.2.4

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: true
      matrix:
        config:
          - {
            name: "with lua5.1",
            os: "ubuntu-latest",
            packages: "liblua5.1-0-dev",
            cmake_opts: "-DSTANDALONE=1 -DWITH_LUAJIT=0"
          }
          - {
            name: "with luajit",
            os: "ubuntu-latest",
            packages: "libluajit-5.1-dev",
            cmake_opts: "-DSTANDALONE=1 -DWITH_LUAJIT=1"
          }

    steps:
      - uses: actions/checkout@v7

      - name: Install Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build pkg-config wget \
            zlib1g-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libfreetype-dev libharfbuzz-dev \
            libpng-dev libjpeg-dev libwebp-dev libtiff-dev libgif-dev \
            libogg-dev libvorbis-dev libopusfile-dev libxmp-dev \
            ${{ matrix.config.packages }}

      - name: Cache SDL3
        id: cache-sdl
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sdl
          key: ${{ runner.os }}-sdl3-${{ env.SDL3_VER }}-${{ env.SDL3_TTF_VER }}-${{ env.SDL3_IMAGE_VER }}-${{ env.SDL3_MIXER_VER }}

      - name: Build SDL3
        if: steps.cache-sdl.outputs.cache-hit != 'true'
        run: |
          set -e
          ROOT="${{ runner.temp }}/sdl"
          build() {
            name="$1"; tag="$2"; shift 2
            git clone --depth 1 -b "$tag" "https://github.com/libsdl-org/$name.git" "/tmp/$name"
            cmake -S "/tmp/$name" -B "/tmp/$name/build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr "$@"
            cmake --build "/tmp/$name/build"
            DESTDIR="$ROOT" cmake --install "/tmp/$name/build"
            # components built with VENDORED=OFF look for SDL3 in /usr
            sudo cp -a "$ROOT/usr/." /usr/
            sudo ldconfig
          }
          build SDL "$SDL3_VER" -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          build SDL_ttf "$SDL3_TTF_VER" -DSDLTTF_VENDORED=OFF -DSDLTTF_SAMPLES=OFF -DSDLTTF_PLUTOSVG=OFF
          build SDL_image "$SDL3_IMAGE_VER" -DSDLIMAGE_VENDORED=OFF -DSDLIMAGE_SAMPLES=OFF -DSDLIMAGE_TESTS=OFF -DSDLIMAGE_AVIF=OFF -DSDLIMAGE_JXL=OFF -DSDLIMAGE_SVG=OFF
          build SDL_mixer "$SDL3_MIXER_VER" -DSDLMIXER_VENDORED=OFF -DSDLMIXER_TESTS=OFF -DSDLMIXER_EXAMPLES=OFF -DSDLMIXER_GME=OFF -DSDLMIXER_MOD=ON -DSDLMIXER_MOD_XMP_SHARED=OFF -DSDLMIXER_MIDI=OFF -DSDLMIXER_WAVPACK=OFF -DSDLMIXER_FLAC_LIBFLAC=OFF

      - name: Install SDL3
        run: |
          sudo cp -a "${{ runner.temp }}/sdl/usr/." /usr/
          sudo ldconfig

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.config.cmake_opts }}

      - name: Build
        run: cmake --build ./build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure
