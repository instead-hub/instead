name: Windows version

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

env:
  SDL3_VER: release-3.4.10
  SDL3_TTF_VER: release-3.2.2
  SDL3_IMAGE_VER: release-3.4.6
  SDL3_MIXER_VER: release-3.2.4
  LUAJIT_REV: v2.1
  LIBXMP_VER: libxmp-4.6.3

jobs:
  build:
    name: Windows version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential wget cmake ninja-build gcc-multilib \
            gcc-mingw-w64-i686 mingw-w64-i686-dev binutils-mingw-w64-i686

      - name: Fetch dependencies
        run: |
          set -e
          mkdir -p bin src/windows/include src/windows/lib
          fetch() {
            url="$1"
            tmp="$(mktemp -d)"
            wget -q "$url"
            file="${url##*/}"
            tar xzf "$file" --strip-components=1 -C "$tmp"
            cp -a "$tmp"/i686-w64-mingw32/include/* src/windows/include/
            cp -a "$tmp"/i686-w64-mingw32/lib/* src/windows/lib/
            cp -a "$tmp"/i686-w64-mingw32/bin/*.dll bin/
            rm -rf "$tmp" "$file"
          }
          ver="${SDL3_VER#release-}"
          fetch "https://github.com/libsdl-org/SDL/releases/download/$SDL3_VER/SDL3-devel-$ver-mingw.tar.gz"
          ver="${SDL3_TTF_VER#release-}"
          fetch "https://github.com/libsdl-org/SDL_ttf/releases/download/$SDL3_TTF_VER/SDL3_ttf-devel-$ver-mingw.tar.gz"
          ver="${SDL3_IMAGE_VER#release-}"
          fetch "https://github.com/libsdl-org/SDL_image/releases/download/$SDL3_IMAGE_VER/SDL3_image-devel-$ver-mingw.tar.gz"
          ver="${SDL3_MIXER_VER#release-}"
          fetch "https://github.com/libsdl-org/SDL_mixer/releases/download/$SDL3_MIXER_VER/SDL3_mixer-devel-$ver-mingw.tar.gz"

          # The MinGW build of SDL3_ttf imports ScriptFreeCache/ScriptPlace
          # from gdi32.dll, which exports them only since Windows 8. The MSVC
          # build imports all Uniscribe functions from usp10.dll and works on
          # Windows 7. Exports are identical, so keep the MinGW import library.
          ver="${SDL3_TTF_VER#release-}"
          wget -q "https://github.com/libsdl-org/SDL_ttf/releases/download/$SDL3_TTF_VER/SDL3_ttf-devel-$ver-VC.zip"
          unzip -q "SDL3_ttf-devel-$ver-VC.zip" "SDL3_ttf-$ver/lib/x86/SDL3_ttf.dll" -d ttf-vc
          cp -f "ttf-vc/SDL3_ttf-$ver/lib/x86/SDL3_ttf.dll" bin/
          rm -rf ttf-vc "SDL3_ttf-devel-$ver-VC.zip"

      - name: Cache LuaJIT
        id: cache-luajit
        uses: actions/cache@v6
        with:
          path: luajit
          key: ${{ runner.os }}-luajit-mingw32-${{ env.LUAJIT_REV }}

      - name: Build LuaJIT
        if: steps.cache-luajit.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --depth 1 --branch "$LUAJIT_REV" https://github.com/LuaJIT/LuaJIT.git luajit
          make -C luajit HOST_CC="gcc -m32" CROSS=i686-w64-mingw32- TARGET_SYS=Windows TARGET_SHLDFLAGS="-static-libgcc" -j$(nproc)

      - name: Install LuaJIT
        run: |
          cp luajit/src/lua.h luajit/src/luaconf.h luajit/src/lualib.h \
            luajit/src/lauxlib.h luajit/src/luajit.h src/windows/
          cp luajit/src/libluajit-5.1.dll.a src/windows/
          cp luajit/src/lua51.dll bin/

      - name: Cache libxmp
        id: cache-libxmp
        uses: actions/cache@v6
        with:
          path: libxmp
          key: ${{ runner.os }}-libxmp-mingw32-${{ env.LIBXMP_VER }}

      - name: Build libxmp
        if: steps.cache-libxmp.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --depth 1 --branch "$LIBXMP_VER" https://github.com/libxmp/libxmp.git libxmp
          cmake -S libxmp -B libxmp/build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF \
            -DCMAKE_SHARED_LINKER_FLAGS=-static-libgcc
          cmake --build libxmp/build

      - name: Install libxmp
        run: cp libxmp/build/libxmp.dll bin/

      - name: Build libiconv
        run: |
          set -e
          wget -q https://ftp.gnu.org/pub/gnu/libiconv/libiconv-1.18.tar.gz
          tar xzf libiconv-1.18.tar.gz
          cd libiconv-1.18
          ./configure --host=i686-w64-mingw32 --disable-shared --enable-static \
            --prefix="$PWD/../libiconv"
          make -j"$(nproc)"
          make install
          cd ..
          cp -a libiconv/include/iconv.h src/windows/include/
          cp -a libiconv/lib/libiconv.a src/windows/lib/

      - name: Configure
        run: ./configure-mingw32.sh

      - name: Build
        run: make -f Makefile.mingw -j$(nproc)

      - name: Create Artifact
        run: make install -f Makefile.mingw

      - name: Publish Artifact
        uses: actions/upload-artifact@v7
        with:
          name: instead-win
          path: bin
          retention-days: 1
