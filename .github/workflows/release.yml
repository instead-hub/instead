name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. 3.6.0'
        required: true
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false

jobs:
  appimage:
    uses: ./.github/workflows/appimage.yml
  windows:
    uses: ./.github/workflows/windows.yml
  emscripten:
    uses: ./.github/workflows/emscripten.yml
  macos:
    uses: ./.github/workflows/macos.yml
  docs:
    uses: ./.github/workflows/docs.yml

  tarball:
    name: source tarball
    needs: [docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: instead-doc
          path: doc
      - name: Build tarball
        run: make tarball
      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: instead_*.tar.gz

  publish:
    name: publish release
    needs: [appimage, windows, emscripten, macos, docs, tarball]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh needs a git repository (and its history for --generate-notes).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Package
        run: |
          set -e
          find dist -maxdepth 4 | sort
          cp dist/tarball/*.tar.gz .
          WIN=dist/instead-win
          if [ -d "$WIN/bin" ]; then WIN="$WIN/bin"; fi
          (cd "$WIN" && zip -qr "$GITHUB_WORKSPACE/instead-win.zip" .)
          EM=dist/instead-em
          if [ ! -d "$EM/instead-em" ]; then EM="$EM/release"; fi
          (cd "$EM" && zip -qr "$GITHUB_WORKSPACE/instead-em.zip" instead-em)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ inputs.tag }}"
          FILES=(
            dist/AppImage/INSTEAD-x86_64.AppImage
            instead_*.tar.gz
            instead-win.zip
            instead-em.zip
            dist/instead-macos-x86_64/INSTEAD-macos-x86_64.dmg
            dist/instead-macos-arm64/INSTEAD-macos-arm64.dmg
            dist/instead-doc/stead3-ru.pdf
            dist/instead-doc/modules3-ru.pdf
            dist/instead-doc/stead3-en.pdf
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            ARGS=(--target "$GITHUB_SHA" --title "INSTEAD $TAG" --generate-notes --draft)
            if [ "${{ inputs.prerelease }}" = "true" ]; then ARGS+=(--prerelease); fi
            gh release create "$TAG" "${ARGS[@]}" "${FILES[@]}"
          fi
