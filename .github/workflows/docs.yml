name: documentation

on:
  push:
    branches: [master, SDL3]
    paths:
      - 'doc/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
  workflow_call:

jobs:
  pdf:
    name: PDF documentation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-lang-cyrillic texlive-lang-greek texlive-fonts-recommended \
            fonts-liberation fonts-dejavu-core

      - name: Cache MultiMarkdown
        id: cache-mmd
        uses: actions/cache@v6
        with:
          path: MultiMarkdown-6/build
          key: ${{ runner.os }}-multimarkdown-6.7.0

      - name: Build MultiMarkdown
        if: steps.cache-mmd.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 6.7.0 \
            https://github.com/fletcher/MultiMarkdown-6.git
          # cmake_minimum_required(2.9) needs this on cmake >= 4
          cmake -S MultiMarkdown-6 -B MultiMarkdown-6/build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build MultiMarkdown-6/build -j"$(nproc)"

      - name: Add MultiMarkdown to PATH
        run: echo "$PWD/MultiMarkdown-6/build" >> "$GITHUB_PATH"

      - name: Non-interactive xelatex
        run: |
          # make recipes call plain xelatex; do not hang on errors
          REAL=$(command -v xelatex)
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec %s -interaction=nonstopmode -halt-on-error "$@"\n' "$REAL" \
            > "$RUNNER_TEMP/bin/xelatex"
          chmod +x "$RUNNER_TEMP/bin/xelatex"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build PDF
        run: |
          # make includes these (untracked, generated by configure.sh normally)
          ln -sf Rules.make.standalone Rules.make
          : > config.make
          make -C doc pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          name: instead-doc
          path: |
            doc/stead3-ru.pdf
            doc/modules3-ru.pdf
            doc/stead3-en.pdf
          retention-days: 30
